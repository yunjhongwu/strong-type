name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ "opened", "synchronize", "reopened", "ready_for_review" ]
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  no_std:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build no_std (no features)
        run: cargo build -p strong-type --no-default-features

      - name: Build no_std + alloc
        run: cargo build -p strong-type --no-default-features --features alloc

      - name: Verify on no_std target
        run: cargo build -p strong-type --target thumbv7m-none-eabi --no-default-features
