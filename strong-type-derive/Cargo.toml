[package]
name = "strong-type-derive"
description = "Macro implementation for #[derive(StrongType)]"
version = "1.1.0"
edition = "2024"

license = "MIT OR Apache-2.0"
keywords = ["primitive", "string", "strongly-typed", "no_std"]
repository = "https://github.com/yunjhongwu/strong-type"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
